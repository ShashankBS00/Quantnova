<svg width="260" height="80" viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg" id="logo-light">
      <defs>
        <linearGradient id="qgrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4F6BFF"/>
          <stop offset="100%" stop-color="#7B93FF"/>
        </linearGradient>
      </defs>
      <!-- Outer ring -->
      <circle cx="40" cy="40" r="34" fill="none" stroke="url(#qgrad)" stroke-width="3.5"/>
      <!-- Inner accent arc (top-right quarter) -->
      <path d="M40 8 A32 32 0 0 1 72 40" fill="none" stroke="#4F6BFF" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
      <!-- Q body -->
      <circle cx="40" cy="40" r="22" fill="#4F6BFF"/>
      <!-- Q letter -->
      <text x="40" y="49" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="-1">Q</text>
      <!-- Q tail notch -->
      <line x1="53" y1="54" x2="63" y2="64" stroke="#4F6BFF" stroke-width="4" stroke-linecap="round"/>
      <!-- Wordmark -->
      <text x="88" y="36" font-family="Arial,sans-serif" font-weight="800" font-size="26" fill="#0B0F2E" letter-spacing="-0.5">Quant</text>
      <text x="88" y="36" font-family="Arial,sans-serif" font-weight="800" font-size="26" fill="#4F6BFF" letter-spacing="-0.5" dx="78">Nova</text>
      <!-- Tagline -->
      <text x="88" y="56" font-family="Arial,sans-serif" font-weight="400" font-size="11.5" fill="#546E7A" letter-spacing="0.02em">Trade smarter. Powered by AI.</text>
    </svg>